# Author: Luca Obwegs
#
# Builds and runs the host-side tests for the sensor-fusion algorithms and
# EEPROM settings storage on every push and pull request. The tests link
# production C sources and need neither the STM32 target nor hardware.
name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests
        run: make -C tests test
